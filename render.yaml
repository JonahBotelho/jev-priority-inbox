services:
  - type: web
    name: jev-priority-inbox-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        value: https://jev-priority-inbox-client.onrender.com
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: JEV_FUNCTION_URL
        sync: false
      - key: JEV_FUNCTION_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false

  - type: web
    name: jev-priority-inbox-client
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist/client
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https:; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
