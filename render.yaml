services:
  - type: web
    name: jev-priority-inbox-api
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /v1/health
    disk:
      name: jev-priority-inbox-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.3
      - key: SQLITE_PATH
        value: /var/data/mail.sqlite
      - key: MAIL_ENCRYPTION_KEY
        sync: false
      - key: APP_JWT_SECRET
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: JEV_FUNCTION_URL
        sync: false
      - key: JEV_FUNCTION_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
